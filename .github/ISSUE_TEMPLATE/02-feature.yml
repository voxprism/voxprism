name: ✨ 기능 제안
description: 새 기능이나 동작 변경을 제안해요 (구현 전에 스펙을 먼저 씁니다)
title: "feat: "
labels: ["✨ feat", "🔍 needs-spec"]
body:
  - type: markdown
    attributes:
      value: |
        VoxPrism은 **스펙 주도 개발(SDD)**을 합니다. 이 이슈가 받아들여지면 `specs/NNN-…/spec.md`를 먼저 쓰고, 승인 뒤에 구현합니다.
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제를 풀고 싶나요?
      description: 누가, 어떤 상황에서, 무엇 때문에 불편한가
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 이렇게 되면 완료 (수용 기준 초안)
      placeholder: |
        - [ ] 웃음소리가 [웃음] 자막으로 0.8초 이상 표시된다
  - type: textarea
    id: alternatives
    attributes:
      label: 생각해 본 다른 방법
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options: [P1 높음, P2 보통]
