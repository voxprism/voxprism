name: 🐛 버그 리포트
description: 스펙(기대 동작)과 다르게 동작해요
title: "fix: "
labels: ["🐛 bug"]
body:
  - type: markdown
    attributes:
      value: |
        재현할 수 있게 써 주세요. **비밀번호·키·서버 주소는 적지 마세요.**
  - type: textarea
    id: what
    attributes:
      label: 무엇이 잘못됐나요?
      placeholder: 예) 두 사람이 동시에 말한 구간에서 한 사람 자막만 나와요
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 영상 길이, 출연자 수 설정, 옵션(겹친 말 복원·소리 자막·엔진), 브라우저
      placeholder: |
        1. 3분짜리 4인 대화 영상, 출연자 수 4, 복원 켬
        2. 1:32 부근 재생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 어느 요구사항(FR-…)이나 스펙(SPEC-…)과 다른지 알면 적어 주세요
  - type: input
    id: job
    attributes:
      label: 작업 ID
      placeholder: 20261118-031253-c75da8
  - type: textarea
    id: logs
    attributes:
      label: 화면·로그
      description: 스크린샷, 상태 메시지, 경고 문구
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [파이프라인(인식·화자·겹친 말·자막), 웹 화면·API, 로그인, 인프라·배포, 평가]
    validations:
      required: true
