name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-ci.txt
      - name: 가벼운 의존성 설치 (모델 없음)
        run: pip install -r app/requirements-ci.txt
      - name: 문법 오류·정의 안 된 이름 검사
        run: ruff check --select E9,F63,F7,F82 app scripts
      - name: 단위 테스트
        working-directory: app
        run: python -m pytest -q tests
      - name: SDD 스펙 검사
        run: python3 scripts/check_specs.py

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 비밀 값·키 파일 검사
        run: python3 scripts/scan_secrets.py --all
