server {
    listen 80 default_server;   # NCP 서버는 IPv6가 꺼져 있어 [::]:80 은 쓰지 않음
    server_name _;

    client_max_body_size 1100m;
    client_body_timeout 600s;

    # 로그인 여부는 앱(FastAPI)이 판단: 204 = 통과, 401 = 거절
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
    }

    # 영상·썸네일은 nginx가 직접 전송 (Range 요청 지원 → 탐색이 빠름), 로그인한 사용자만
    location ~ "^/media/(\d{8}-\d{6}-[0-9a-f]{6})/(preview\.mp4|burned\.mp4|thumbs/S\d+_\d\.jpg)$" {
        auth_request /_auth;
        alias /srv/whosaid/data/jobs/$1/$2;
        add_header Cache-Control "private, max-age=600";
    }
    location /media/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
